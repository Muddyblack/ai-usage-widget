name: macOS

on:
  pull_request:
  push:
    branches:
      - main
      - master
      # The macOS frontend cannot be run on the machine it is developed from,
      # so its branches build here rather than only on a pull request.
      - 'claude/**'
      - 'macos/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      # Developer ID signing and notarization (release.yml sets it). Skipped
      # anyway while the Apple Developer secrets are not set.
      notarize:
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # The providers' macOS paths and Keychain reads, on a real Mac. The suites
  # themselves are the portable ones lint.yml already runs on Linux and
  # Windows; what this adds is a platform where paths.IS_MACOS is true.
  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the backend suites
        run: python3 -m unittest discover -s tests/python -v

      - name: The backend answers on this platform
        run: |
          ./backend/sh/get-ai-usage --list
          # --all with no credentials anywhere: every provider should come back
          # as a readable error row, not a traceback.
          ./backend/sh/get-ai-usage --all > /tmp/envelope.json
          python3 -c "
          import json, sys
          envelope = json.load(open('/tmp/envelope.json'))
          assert envelope['schemaVersion'] == 1, envelope
          print(f\"{len(envelope['providers'])} providers answered\")
          for provider in envelope['providers']:
              print(f\"  {provider['id']:12} ok={provider['ok']!s:5} {provider['error'] or provider['summary']['text']}\")
          "

  # One build per CPU: psutil ships no universal wheel, so a universal app
  # would mean stitching two builds together. Apple Silicon on macos-14,
  # Intel on macos-15-intel (GitHub's last Intel image).
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            runner: macos-14
          - arch: intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # Signing and notarization (hosts/macos/notarize.sh): only for a
      # release, and only once the Apple Developer secrets exist. Without
      # them the app stays ad-hoc signed, as before.
      NOTARIZE: ${{ inputs.notarize == true && secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python3 -m pip install -r hosts/macos/build-requirements.txt

      - name: Self-test and screenshots (from the checkout)
        env:
          QT_QPA_PLATFORM: offscreen
          # A throwaway settings file, so the run cannot read or write
          # anything of the runner's.
          AI_USAGE_CONFIG: ${{ runner.temp }}/settings.json
        run: |
          python3 hosts/desktop/app.py --selftest
          # Demo data: a CI runner has no AI subscriptions, and the
          # screenshots have to be reproducible.
          python3 hosts/desktop/app.py --screenshot "$RUNNER_TEMP/screens" --demo
          ls -la "$RUNNER_TEMP/screens"

      - name: The native macOS modules import
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'hosts/macos')
          import statusitem, vibrancy, loginitem
          print('statusitem, vibrancy, loginitem ok')
          "

      - name: Build the app bundle
        run: hosts/macos/build-app.sh

      - name: The bundle is built for this CPU
        run: |
          file "dist/AI Usage.app/Contents/MacOS/AI Usage"
          case "${{ matrix.arch }}" in
            apple-silicon) file "dist/AI Usage.app/Contents/MacOS/AI Usage" | grep -q arm64 ;;
            intel) file "dist/AI Usage.app/Contents/MacOS/AI Usage" | grep -q x86_64 ;;
          esac

      - name: Self-test the bundled app
        env:
          QT_QPA_PLATFORM: offscreen
          AI_USAGE_CONFIG: ${{ runner.temp }}/bundle-settings.json
        run: '"dist/AI Usage.app/Contents/MacOS/AI Usage" --selftest'

      # The proof the other pictures are not just an offscreen render: the
      # real app on the runner's real desktop, full screen. On a first start
      # (a fresh settings file) the popup opens by itself under the menu bar
      # item, with the demo data. Best effort: a runner image without screen
      # recording rights only loses this one picture.
      - name: Full-screen capture of the running app
        if: matrix.arch == 'apple-silicon'
        continue-on-error: true
        env:
          AI_USAGE_CONFIG: ${{ runner.temp }}/desktop-settings.json
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          python3 hosts/desktop/app.py --demo > "$RUNNER_TEMP/desktop.log" 2>&1 &
          pid=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/screens/desktop-macos.png"
          kill "$pid" || true
          cat "$RUNNER_TEMP/desktop.log"
          ls -la "$RUNNER_TEMP/screens/desktop-macos.png"

      - name: Import the signing certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign the app (Developer ID)
        if: env.NOTARIZE == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: hosts/macos/notarize.sh app

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'apple-silicon'
        id: screenshots-upload
        continue-on-error: true
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: error

      # Artifact finalization can intermittently return an intermediary 403.
      - name: Wait before retrying screenshot upload
        if: matrix.arch == 'apple-silicon' && steps.screenshots-upload.outcome == 'failure'
        run: sleep 10

      - name: Retry screenshot upload
        if: matrix.arch == 'apple-silicon' && steps.screenshots-upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: error
          overwrite: true

      - name: Create DMG
        run: bash hosts/macos/package-dmg.sh

      - name: Notarize the DMG
        if: env.NOTARIZE == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: hosts/macos/notarize.sh dmg ai-usage-macos-*.dmg

      # ditto, not zip: it preserves the app bundle's extended attributes
      # (the codesign signature) the way Finder's own "Compress" does.
      - name: zip
        run: |
          VERSION="$(grep -oE '"Version":[[:space:]]*"[^"]+"' hosts/kde/metadata.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
          ditto -c -k --keepParent "dist/AI Usage.app" "ai-usage-macos-$VERSION-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        id: app-upload
        continue-on-error: true
        with:
          name: ai-usage-macos-${{ matrix.arch }}
          path: |
            ai-usage-macos-*.zip
            ai-usage-macos-*.dmg
          if-no-files-found: error
          # A release has its own copy attached; this one is for trying a build.
          retention-days: 14

      # Artifact finalization can intermittently return an intermediary 403.
      - name: Wait before retrying app upload
        if: steps.app-upload.outcome == 'failure'
        run: sleep 10

      - name: Retry app upload
        if: steps.app-upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ai-usage-macos-${{ matrix.arch }}
          path: |
            ai-usage-macos-*.zip
            ai-usage-macos-*.dmg
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The screenshots in a comment on the pull request, updated with every new
  # commit. Here, in the PR's own workflow, because a workflow triggered any
  # other way (a comment, workflow_run) only runs once it is on the default
  # branch. Nothing of the PR runs in this job: it reads the app job's PNGs
  # and commits them to one orphan branch, `ci-screenshots`, a pr-<n>/ folder
  # per PR. GitHub has no API for attaching an image to a comment, so a
  # committed file is the only URL a comment can embed. The comment links the
  # commit, so its images outlive the folder, which macos-screenshots.yml
  # removes when the PR closes. Fork PRs have read-only tokens; their PNGs
  # stay in the run's artifact.
  screenshots-comment:
    needs: [backend, app]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: macos-screenshots-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      BRANCH: ci-screenshots
    steps:
      # No checkout or execution of app code in this publishing job.
      - uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens

      - name: Commit the PNGs and update the PR conversation
        uses: actions/github-script@v8
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const number = Number(process.env.PR);
            const sha = process.env.SHA;
            const folder = `pr-${number}/`;

            const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (current.state !== 'open' || current.head.sha !== sha) {
              core.info('Skipping screenshots of a superseded commit or a closed PR.');
              return;
            }

            const dir = process.env.SCREENSHOT_DIR;
            const names = fs.readdirSync(dir).filter(name => /^[a-z0-9-]+\.png$/.test(name)).sort();
            if (!names.length) throw new Error('Screenshot artifact contains no PNGs');
            const files = [];
            for (const name of names) {
              const file = path.join(dir, name);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > 10 * 1024 * 1024) throw new Error(`Invalid screenshot: ${name}`);
              const png = fs.readFileSync(file);
              if (!png.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])))
                throw new Error(`Not a PNG: ${name}`);
              const { data: blob } = await github.rest.git.createBlob({ ...repo, content: png.toString('base64'), encoding: 'base64' });
              files.push({ path: folder + name, mode: '100644', type: 'blob', sha: blob.sha });
            }

            // Replace this PR's folder on the shared branch. Another PR's run
            // may move the branch in between, so a rejected update starts over
            // from the new tip.
            let commit;
            for (let attempt = 1; ; attempt++) {
              let parent = null;
              let baseTree;
              try {
                const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `heads/${process.env.BRANCH}` });
                parent = ref.object.sha;
                const { data: tip } = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
                baseTree = tip.tree.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const tree = [...files];
              // A new branch gets a README, which also keeps its tree from
              // ever going empty when the last PR folder is removed.
              if (!baseTree)
                tree.push({ path: 'README.md', mode: '100644', type: 'blob',
                  content: '# CI screenshots\n\nWritten by .github/workflows/macos-screenshots.yml: one pr-<n>/ folder per pull request that asked for `/macos`, removed when the PR closes. Not for merging.\n' });
              if (baseTree) {
                const { data: old } = await github.rest.git.getTree({ ...repo, tree_sha: baseTree, recursive: 'true' });
                const keep = new Set(files.map(f => f.path));
                for (const entry of old.tree)
                  if (entry.type === 'blob' && entry.path.startsWith(folder) && !keep.has(entry.path))
                    tree.push({ path: entry.path, mode: entry.mode, type: 'blob', sha: null });
              }
              const { data: snapshot } = await github.rest.git.createTree({ ...repo, tree, ...(baseTree ? { base_tree: baseTree } : {}) });
              ({ data: commit } = await github.rest.git.createCommit({
                ...repo, message: `macOS screenshots for PR #${number} (${sha.slice(0, 7)})`,
                tree: snapshot.sha, parents: parent ? [parent] : []
              }));
              try {
                if (parent)
                  await github.rest.git.updateRef({ ...repo, ref: `heads/${process.env.BRANCH}`, sha: commit.sha, force: false });
                else
                  await github.rest.git.createRef({ ...repo, ref: `refs/heads/${process.env.BRANCH}`, sha: commit.sha });
                break;
              } catch (error) {
                if (attempt >= 5 || ![409, 422].includes(error.status)) throw error;
                core.info(`Branch moved, retrying (${attempt})`);
              }
            }

            const marker = '<!-- macos-screenshots -->';
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${process.env.RUN}`;
            const imageRoot = `${context.serverUrl}/${repo.owner}/${repo.repo}/blob/${commit.sha}/${folder}`;
            let body = `${marker}\n### macOS screenshots (${sha.slice(0, 7)})\n\n`;
            body += `[Build and downloadable PNGs](${runUrl}) · updated with every new commit\n\n`;
            body += `<details>\n<summary>View screenshots (${names.length})</summary>\n\n`;
            for (const name of names) {
              body += `**${name}**\n\n![${name}](${imageRoot}${name}?raw=true)\n\n`;
            }
            body += `</details>\n`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: number, body });
            }
