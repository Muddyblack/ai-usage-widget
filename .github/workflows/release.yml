name: Release

on:
  push:
    tags:
      - "v*"

# Read-only unless a job asks for more; only the jobs that publish do.
permissions:
  contents: read

jobs:
  # The .plasmoid release goes out on its own, so a broken Windows build cannot
  # hold it back; the Windows files are attached to it once they have passed.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # make pack compiles the translations (msgfmt) before zipping.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Build .plasmoid
        run: make pack

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      # The .mo files are not in git, so a pack that skipped build.sh would ship
      # an English-only widget without failing.
      - name: Check the translations are in the archive
        env:
          ARTIFACT: ${{ steps.info.outputs.artifact }}
        run: unzip -l "$ARTIFACT" | grep -qE 'contents/locale/[^/]+/LC_MESSAGES/[^ ]+\.mo$'

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            Install by downloading the `.plasmoid` file and running:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```

            **Windows:** run `AI-Usage-Setup-${{ steps.info.outputs.version }}.exe` (no admin rights needed; it updates an existing install in place). Or unzip `ai-usage-windows-${{ steps.info.outputs.version }}.zip` anywhere and run `AI Usage.exe`. Either way it lives in the tray.

            **macOS:** open `ai-usage-macos-${{ steps.info.outputs.version }}.dmg` and drag `AI Usage.app` to Applications (ZIP also available). It lives in the menu bar. The app is ad-hoc signed and not notarized: if macOS blocks it, use System Settings → Privacy & Security → Open Anyway after attempting to launch. No developer account is needed to use it. See the [macOS install guide](https://github.com/Muddyblack/ai-usage-widget/blob/main/docs/macos.md#signing-and-distribution).

            All platform assets are attached a few minutes after the release appears, once their build has passed.
          files: |
            ${{ steps.info.outputs.artifact }}

  # The workflow every push runs — the tests, the build, the built .exe's own
  # selftest, the installer — with the release's version in the file names.
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  windows-assets:
    needs: [release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-usage-windows

      - name: Attach the Windows build to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ai-usage-windows-*.zip
            AI-Usage-Setup-*.exe

  # The workflow every push runs, with the app job's version-stamped ZIP and DMG
  # this time (macos.yml derives its version from package/metadata.json,
  # so unlike windows.yml it needs no version input).
  macos:
    uses: ./.github/workflows/macos.yml
    # macos.yml's screenshots-comment job needs these; a reusable workflow's
    # jobs can't be granted more than the caller job explicitly passes down,
    # even for a job whose `if:` will never be true on a tag push.
    permissions:
      contents: write
      pull-requests: write

  macos-assets:
    needs: [release, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-usage-macos

      - name: Attach the macOS build to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ai-usage-macos-*.zip
            ai-usage-macos-*.dmg
