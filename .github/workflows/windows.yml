name: Windows

# The portable half of the tests (tests/python) on Windows and Linux, the tray
# app's QML loaded headless on both, and the Windows build: the .exe, checked
# with its own --selftest, zipped and wrapped in the installer. release.yml runs
# this same workflow for a tag and attaches what it builds to the release.

on:
  pull_request:
  push:
    branches:
      - main
      - master
  # A build from any branch by hand: Actions → Windows → Run workflow.
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Generate demo screenshots as an artifact'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: The release's version (a leading "v" is dropped); names the files and the installer
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Only meaningful for pull_request/push: a workflow_dispatch run was asked
  # for by hand and a workflow_call run is release.yml cutting a release, so
  # both always build regardless of what changed.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'windows/**'
              - 'package/contents/tools/aiusage/**'
              - 'tests/python/**'
              # The app runs the Hyprland QML, the shared JS and the translations.
              - 'hyprland/**'
              - 'package/contents/code/**'
              - 'translate/**'
              - '.github/workflows/windows.yml'
              # Shared demo data for frontend screenshots.
              - 'scripts/demo-envelope.py'

  test:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || needs.changes.outputs.relevant == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: package/contents/tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # The app's ranges, not the build's pins: the newest PySide6 is tried here
      # before a bump of windows/build-requirements.txt ships it.
      - name: install
        run: python -m pip install -r windows/requirements.txt

      - name: unit tests
        run: python -m unittest discover -s tests/python -v

      - name: backend smoke run
        run: python -m aiusage --provider claude,antigravity,openai

      - name: tray app loads
        run: python windows/app.py --selftest

      - name: Screenshots
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          # A throwaway config file so the run cannot read or write the
          # runner's real settings.
          AI_USAGE_CONFIG: ${{ runner.temp }}\settings.json
        run: |
          $screens = "$env:RUNNER_TEMP\screens"
          python windows/app.py --screenshot $screens --demo
          Get-ChildItem $screens

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.screenshots
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}\screens\*.png
          if-no-files-found: error

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: version
        shell: pwsh
        env:
          # Through the environment rather than spliced into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:INPUT_VERSION".TrimStart("v")
          if (-not $version) { $version = "0.0.0-ci" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: build
        run: |
          python -m pip install -r windows/build-requirements.txt
          pyinstaller --noconfirm windows/ai-usage.spec

      - name: bundled app loads
        shell: pwsh
        # The selftest takes seconds; a hang (a modal error dialog nobody can
        # click) should fail fast rather than sit out the six-hour job limit.
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/AI Usage/AI Usage.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            # The .exe has no console; its warnings and errors go to tray.log.
            Get-Content "$env:LOCALAPPDATA\ai-usage-widget\tray.log" -ErrorAction SilentlyContinue
            exit $p.ExitCode
          }

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Usage" -DestinationPath "ai-usage-windows-$env:VERSION.zip"

      - name: installer
        shell: pwsh
        run: windows/build-installer.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: ai-usage-windows
          path: |
            ai-usage-windows-*.zip
            AI-Usage-Setup-*.exe
          if-no-files-found: error
          # A release has its own copy attached; this one is for trying a build.
          retention-days: 14
