name: macOS screenshots

# Puts the macOS screenshots of a pull request into a comment on it, on
# request: a maintainer comments `/macos` (or runs this from the Actions tab
# with the PR number). That labels the PR `macos-screenshots`, and from then
# on every new commit's screenshots replace the comment's by themselves.
#
# Nothing of the PR runs here. The pictures are taken by macos.yml's app job,
# which runs on every pull request in that PR's own, unprivileged context and
# keeps them as its `screenshots` artifact; this workflow only downloads that
# artifact (checked: PNGs only) and publishes it. Running the PR's code in
# this privileged context instead would let it poison the default branch's
# caches (CodeQL: actions/cache-poisoning).
#
# Where the PNGs live: GitHub has no API for attaching an image to a comment,
# so a comment can only embed an image some URL already serves. They go to a
# single orphan branch, `ci-screenshots`, one folder per PR (pr-<n>/), and
# the folder is removed again when the PR closes. The comment links the
# commit, not the branch, so its images keep working after that.
#
# This file only takes effect from the default branch: GitHub reads
# issue_comment, workflow_run and pull_request_target workflows from there.

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [macOS]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

env:
  BRANCH: ci-screenshots
  LABEL: macos-screenshots

jobs:
  # Which PR, which commit, and which macOS run has its screenshots.
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/macos') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      sha: ${{ steps.pick.outputs.sha }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - id: pick
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const label = process.env.LABEL;
            let pr;
            if (context.eventName === 'workflow_run') {
              // A fork's run lists no pull request, so look it up by head commit.
              const run = context.payload.workflow_run;
              const open = await github.paginate(github.rest.pulls.list, { ...repo, state: 'open', per_page: 100 });
              pr = open.find(p => p.head.sha === run.head_sha);
              if (!pr || !pr.labels.some(l => l.name === label)) {
                core.info('Not a pull request that asked for screenshots.');
                return;
              }
            } else {
              const number = context.eventName === 'workflow_dispatch' ? Number(context.payload.inputs.pr) : context.issue.number;
              ({ data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number }));
              if (pr.state !== 'open') {
                core.setFailed(`PR #${number} is not open.`);
                return;
              }
              if (context.eventName === 'issue_comment')
                await github.rest.reactions.createForIssueComment({ ...repo, comment_id: context.payload.comment.id, content: 'eyes' });
              // From now on every finished macOS run of this PR publishes.
              await github.rest.issues.addLabels({ ...repo, issue_number: pr.number, labels: [label] });
            }
            const sha = pr.head.sha;
            // The newest macOS run of the PR's head commit.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: 'macos.yml', head_sha: sha, event: 'pull_request', per_page: 20 });
            const run = runs.workflow_runs[0];
            if (!run) {
              core.setFailed(`No macOS run for ${sha.slice(0, 7)} yet.`);
              return;
            }
            if (run.status !== 'completed') {
              // Its completion triggers this workflow again (workflow_run).
              core.notice(`macOS run ${run.id} is still going; its screenshots are published when it finishes.`);
              return;
            }
            if (run.conclusion !== 'success') {
              core.setFailed(`macOS run ${run.id} did not pass (${run.conclusion}).`);
              return;
            }
            core.setOutput('pr', String(pr.number));
            core.setOutput('sha', sha);
            core.setOutput('run', String(run.id));

  publish:
    needs: resolve
    if: needs.resolve.outputs.run != ''
    runs-on: ubuntu-latest
    # One publish per PR at a time; the script also skips a superseded commit.
    concurrency:
      group: macos-screenshots-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The macOS run's artifact. No checkout, and nothing in it is executed:
      # the script below only reads PNG bytes.
      - uses: actions/download-artifact@v8
        with:
          name: screenshots
          run-id: ${{ needs.resolve.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/screens

      - name: Commit the PNGs and update the PR conversation
        uses: actions/github-script@v8
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
          PR: ${{ needs.resolve.outputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN: ${{ needs.resolve.outputs.run }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const number = Number(process.env.PR);
            const sha = process.env.SHA;
            const folder = `pr-${number}/`;

            const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (current.state !== 'open' || current.head.sha !== sha) {
              core.info('Skipping screenshots of a superseded commit or a closed PR.');
              return;
            }

            const dir = process.env.SCREENSHOT_DIR;
            const names = fs.readdirSync(dir).filter(name => /^[a-z0-9-]+\.png$/.test(name)).sort();
            if (!names.length) throw new Error('Screenshot artifact contains no PNGs');
            const files = [];
            for (const name of names) {
              const file = path.join(dir, name);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > 10 * 1024 * 1024) throw new Error(`Invalid screenshot: ${name}`);
              const png = fs.readFileSync(file);
              if (!png.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])))
                throw new Error(`Not a PNG: ${name}`);
              const { data: blob } = await github.rest.git.createBlob({ ...repo, content: png.toString('base64'), encoding: 'base64' });
              files.push({ path: folder + name, mode: '100644', type: 'blob', sha: blob.sha });
            }

            // Replace this PR's folder on the shared branch. Another PR's run
            // may move the branch in between, so a rejected update starts over
            // from the new tip.
            let commit;
            for (let attempt = 1; ; attempt++) {
              let parent = null;
              let baseTree;
              try {
                const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `heads/${process.env.BRANCH}` });
                parent = ref.object.sha;
                const { data: tip } = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
                baseTree = tip.tree.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const tree = [...files];
              // A new branch gets a README, which also keeps its tree from
              // ever going empty when the last PR folder is removed.
              if (!baseTree)
                tree.push({ path: 'README.md', mode: '100644', type: 'blob',
                  content: '# CI screenshots\n\nWritten by .github/workflows/macos-screenshots.yml: one pr-<n>/ folder per pull request that asked for `/macos`, removed when the PR closes. Not for merging.\n' });
              if (baseTree) {
                const { data: old } = await github.rest.git.getTree({ ...repo, tree_sha: baseTree, recursive: 'true' });
                const keep = new Set(files.map(f => f.path));
                for (const entry of old.tree)
                  if (entry.type === 'blob' && entry.path.startsWith(folder) && !keep.has(entry.path))
                    tree.push({ path: entry.path, mode: entry.mode, type: 'blob', sha: null });
              }
              const { data: snapshot } = await github.rest.git.createTree({ ...repo, tree, ...(baseTree ? { base_tree: baseTree } : {}) });
              ({ data: commit } = await github.rest.git.createCommit({
                ...repo, message: `macOS screenshots for PR #${number} (${sha.slice(0, 7)})`,
                tree: snapshot.sha, parents: parent ? [parent] : []
              }));
              try {
                if (parent)
                  await github.rest.git.updateRef({ ...repo, ref: `heads/${process.env.BRANCH}`, sha: commit.sha, force: false });
                else
                  await github.rest.git.createRef({ ...repo, ref: `refs/heads/${process.env.BRANCH}`, sha: commit.sha });
                break;
              } catch (error) {
                if (attempt >= 5 || ![409, 422].includes(error.status)) throw error;
                core.info(`Branch moved, retrying (${attempt})`);
              }
            }

            const marker = '<!-- macos-screenshots -->';
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${process.env.RUN}`;
            const imageRoot = `${context.serverUrl}/${repo.owner}/${repo.repo}/blob/${commit.sha}/${folder}`;
            let body = `${marker}\n### macOS screenshots (${sha.slice(0, 7)})\n\n`;
            body += `[Build and downloadable PNGs](${runUrl}) · updates with every new commit while the PR has the \`${process.env.LABEL}\` label\n\n`;
            body += `<details>\n<summary>View screenshots (${names.length})</summary>\n\n`;
            for (const name of names) {
              body += `**${name}**\n\n![${name}](${imageRoot}${name}?raw=true)\n\n`;
            }
            body += `</details>\n`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: number, body });
            }
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({ ...repo, comment_id: context.payload.comment.id, content: 'rocket' });
            }

  # A failed request answers the comment rather than failing silently.
  report-failure:
    needs: [resolve, publish]
    if: failure() && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: context.payload.comment.id, content: 'confused' });

  # A closed PR's folder comes off the branch. pull_request_target, not
  # pull_request: a fork's PR gets a read-only token there. Nothing is
  # checked out, so no PR code runs with this token.
  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const folder = `pr-${number}/`;
            for (let attempt = 1; ; attempt++) {
              let parent;
              try {
                const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `heads/${process.env.BRANCH}` });
                parent = ref.object.sha;
              } catch (error) {
                if (error.status === 404) return;
                throw error;
              }
              const { data: tip } = await github.rest.git.getCommit({ ...repo, commit_sha: parent });
              const { data: old } = await github.rest.git.getTree({ ...repo, tree_sha: tip.tree.sha, recursive: 'true' });
              const gone = old.tree.filter(e => e.type === 'blob' && e.path.startsWith(folder))
                .map(e => ({ path: e.path, mode: e.mode, type: 'blob', sha: null }));
              if (!gone.length) {
                core.info(`No screenshots for PR #${number}.`);
                return;
              }
              const { data: snapshot } = await github.rest.git.createTree({ ...repo, base_tree: tip.tree.sha, tree: gone });
              const { data: commit } = await github.rest.git.createCommit({
                ...repo, message: `Remove macOS screenshots of closed PR #${number}`, tree: snapshot.sha, parents: [parent]
              });
              try {
                await github.rest.git.updateRef({ ...repo, ref: `heads/${process.env.BRANCH}`, sha: commit.sha, force: false });
                return;
              } catch (error) {
                if (attempt >= 5 || ![409, 422].includes(error.status)) throw error;
                core.info(`Branch moved, retrying (${attempt})`);
              }
            }
