<svg viewBox="-0.5 -0.65 25 25" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tide-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#6d8bff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- the tide: two thick waves, the lower one fainter like the ebb -->
  <path d="M 2.4,13.6 C 4.6,10.2 7,10.2 9.2,13.6 S 13.8,17 16,13.6 S 20.2,10.2 21.6,12.8" fill="none" stroke="url(#tide-gradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 2.4,19.4 C 4.6,16 7,16 9.2,19.4 S 13.8,22.8 16,19.4 S 20.2,16 21.6,18.6" fill="none" stroke="url(#tide-gradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.72" />
  <!-- the spark: the "SI" in tidesi, rising over the water -->
  <path d="M 12,0.9 C 12,5.6 13.4,7 18.2,7 C 13.4,7 12,8.4 12,13.1 C 12,8.4 10.6,7 5.8,7 C 10.6,7 12,5.6 12,0.9 Z" fill="url(#tide-gradient)" />
